name: paper-nangate45-cnn-resnet34
pdk: nangate45
family: cnn
paper_target_mape_percent: 4.93
protocol:
  split: 80/20 windows
  objective: msre
  optimizer: adam
  learning_rate: 0.0001
  epochs: 50
  seed: 42
entrypoint: models/cnn/train.py
arguments:
  dataset-path: nangate45/small
  model-type: resnet34
  required-layers: [metal1, via1, metal2, via2, metal3, via3, metal4]
  epochs: 50
  batch-size: 64
  lr: 0.0001
  weight-decay: 0.0
  val-split: 0.2
  seed: 42
  labels-solver: rwcap
  max-windows: 0
  num-workers: 8
  output-dir: diagnostics/paper-nangate45-cnn-resnet34
