name: paper-sky130hd-gnn-gcn
pdk: sky130hd
family: gnn
paper_target_mape_percent: 13.9
paper_parameter_count: 20900
recipe_parameter_count: 99970
protocol:
  split: 80/20 windows
  objective: msre
  optimizer: adam
  learning_rate: 0.0001
  epochs: 50
  seed: 42
entrypoint: models/gnn/train_lightning.py
arguments:
  dataset-path: sky130hd/small
  labels-solver: rwcap
  conv-type: gcn
  hidden-dims: [128, 256]
  aggregation-hidden: 128
  standardize-node-features: true
  epochs: 50
  lr: 0.0001
  patience: 0
  gpus: 1
  num-workers: 6
  seed: 42
  checkpoint-dir: checkpoints/paper-sky130hd-gnn-gcn
  log-dir: logs/paper-sky130hd-gnn-gcn
