name: paper-nangate45-gnn-gat
pdk: nangate45
family: gnn
paper_target_mape_percent: 18.0
paper_parameter_count: 84400
recipe_parameter_count: 137666
protocol:
  split: 80/20 windows
  objective: msre
  optimizer: adam
  learning_rate: 0.0001
  epochs: 50
  seed: 42
entrypoint: models/gnn/train_lightning.py
arguments:
  dataset-path: nangate45/small
  labels-solver: rwcap
  conv-type: gat
  hidden-dims: [192, 256]
  heads: 4
  aggregation-hidden: 128
  epochs: 50
  lr: 0.0001
  patience: 0
  gpus: 1
  num-workers: 4
  seed: 42
  checkpoint-dir: checkpoints/paper-nangate45-gnn-gat
  log-dir: logs/paper-nangate45-gnn-gat
