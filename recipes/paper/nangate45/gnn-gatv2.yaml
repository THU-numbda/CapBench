name: paper-nangate45-gnn-gatv2
pdk: nangate45
family: gnn
paper_target_mape_percent: 14.7
paper_parameter_count: 167300
recipe_parameter_count: 167290
protocol:
  split: 80/20 windows
  objective: msre
  optimizer: adam
  learning_rate: 0.0001
  epochs: 50
  seed: 42
entrypoint: models/gnn/train_lightning.py
arguments:
  dataset-path: nangate45/small
  labels-solver: rwcap
  conv-type: gatv2
  hidden-dims: [248, 256]
  heads: 4
  aggregation-hidden: 128
  epochs: 50
  lr: 0.0001
  patience: 0
  gpus: 1
  num-workers: 4
  seed: 42
  checkpoint-dir: checkpoints/paper-nangate45-gnn-gatv2
  log-dir: logs/paper-nangate45-gnn-gatv2
