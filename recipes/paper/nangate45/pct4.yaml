name: paper-nangate45-pct4
pdk: nangate45
family: pct
paper_target_mape_percent: 9.12
protocol:
  split: 80/20 windows
  objective: msre
  optimizer: adam
  learning_rate: 0.0001
  epochs: 50
  seed: 42
entrypoint: models/pct/train.py
arguments:
  dataset-path: nangate45/small
  labels-solver: rwcap
  goal: self
  npoints: 1024
  num-sa-layers: 4
  batch-size: 64
  epochs: 50
  lr: 0.0001
  weight-decay: 0.0
  val-split: 0.2
  seed: 42
  gpu: 0
  num-workers: 4
  output-dir: diagnostics/paper-nangate45-pct4
